[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-recon"
version = "0.2.0"
description = "Website information collection with explicit sources and reproducible reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
butterfly = "butterfly.cli:main"

[tool.setuptools.packages.find]
include = ["butterfly*"]

[tool.setuptools.package-data]
butterfly = ["resources/*.txt"]
